<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <!-- Background -->
  <rect width="300" height="200" fill="#FFF1F2"/>
  <!-- Dashed border -->
  <rect x="10" y="10" width="280" height="180" rx="6" fill="none" stroke="#BE123C" stroke-width="1.5" stroke-dasharray="6,3"/>
  <!-- Badge circle -->
  <circle cx="150" cy="62" r="22" fill="#BE123C" opacity="0.12"/>
  <circle cx="150" cy="62" r="16" fill="none" stroke="#BE123C" stroke-width="2"/>
  <!-- Star path -->
  <path d="M150 50 l3.1 9.5h10l-8.1 5.9 3.1 9.5-8.1-5.9-8.1 5.9 3.1-9.5-8.1-5.9h10z" fill="#BE123C"/>
  <!-- Cert name -->
  <text x="150" y="120" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#BE123C" text-anchor="middle">CE Marking</text>
  <!-- Subtitle -->
  <text x="150" y="145" font-family="Arial, sans-serif" font-size="11" fill="#666666" text-anchor="middle">European Conformity (Placeholder)</text>
  <!-- Footer -->
  <text x="150" y="175" font-family="Arial, sans-serif" font-size="10" fill="#999999" text-anchor="middle">Contact for verification</text>
</svg>
