<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A3320;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#2F5D3A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C8A165;stop-opacity:1" />
    </linearGradient>
    <pattern id="weave" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="none"/>
      <line x1="0" y1="0" x2="8" y2="8" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
      <line x1="8" y1="0" x2="0" y2="8" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="600" fill="url(#heroBg)"/>
  <rect width="1600" height="600" fill="url(#weave)"/>
  <rect x="60" y="60" width="1480" height="480" rx="8" fill="none" stroke="rgba(200,161,101,0.3)" stroke-width="2" stroke-dasharray="12,8"/>
  <text x="800" y="260" font-family="Georgia, serif" font-size="42" font-weight="bold" fill="#FAF7F2" text-anchor="middle" opacity="0.9">Hero Image</text>
  <text x="800" y="320" font-family="Arial, sans-serif" font-size="22" fill="#C8A165" text-anchor="middle" opacity="0.85">Replace with factory / product photo</text>
  <text x="800" y="370" font-family="Arial, sans-serif" font-size="16" fill="rgba(255,255,255,0.5)" text-anchor="middle">Recommended size: 1600 × 600 px  •  JPEG or WebP</text>
</svg>
