# Deploy to Firebase Hosting on push to master
name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No build step needed — this is a plain static site.
      # All files are pre-built in the /public directory.

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GUNNYBAG_B5BE8 }}
          channelId: live
          projectId: gunnybag-b5be8
